stages:
  fetch_data:
    cmd: python src/data/download.py
    deps:
      - src/data/download.py
    outs:
      - data/raw/online_shoppers_intention.csv

  preprocess:
    cmd: python src/features/preprocess.py
    deps:
      - data/raw/online_shoppers_intention.csv
      - configs/config.yaml
      - src/data/loader.py
      - src/features/preprocess.py
      - src/features/preprocessor.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/preprocessor.joblib

  train:
    cmd: python src/models/train_pipeline.py --model-type xgboost
    deps:
      - data/processed/train.csv
      - data/processed/preprocessor.joblib
      - configs/config.yaml
      - configs/model_params.yaml
      - src/models/train.py
      - src/models/train_pipeline.py
    params:
      - configs/model_params.yaml:
          - xgboost
    outs:
      - models/model.joblib

  evaluate:
    cmd: python src/models/evaluate_pipeline.py
    deps:
      - data/processed/test.csv
      - models/model.joblib
      - src/models/evaluate.py
      - src/models/evaluate_pipeline.py
    metrics:
      - metrics.json:
          cache: false
    plots:
      - eval_plots/roc_curve.csv:
          x: fpr
          y: tpr
          cache: false
      - eval_plots/pr_curve.csv:
          x: recall
          y: precision
          cache: false
