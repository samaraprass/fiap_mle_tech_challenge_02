[tool.poetry]
name = "fiap-mle-tech-challenge-fase2"
version = "0.1.0"
description = "Tech Challenge Fase 2 - FIAP Pós Tech Machine Learning Engineering: Propensão de Compra em E-commerce com MLOps"
authors = ["FIAP MLE Group"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
xgboost = "^2.0.3"
mlflow = "^2.11.0"
dvc = "^3.48.0"
matplotlib = "^3.8.3"
seaborn = "^0.13.2"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.1"
joblib = "^1.3.2"
ucimlrepo = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
ipykernel = "^6.29.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = []
