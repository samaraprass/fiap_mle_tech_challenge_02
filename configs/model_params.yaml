logistic_regression:
  C: 1.0
  penalty: "l2"
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"
  random_state: 42

random_forest:
  n_estimators: 200
  max_depth: 10
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

xgboost:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 5.46  # Calculated based on class ratio (~84.5 / 15.5)
  random_state: 42
  eval_metric: "logloss"
